<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>方案 A · 从真实数据库生成模型</title>
  <style>
    :root{--nav:#122a3d;--nav2:#0e2232;--teal:#0c8f87;--teal-dark:#087b74;--teal-soft:#e7f5f3;--ink:#17232f;--text:#34414d;--muted:#74818c;--line:#dfe6e9;--line2:#edf1f2;--bg:#f4f6f8;--white:#fff;--green:#1fb995;--red:#c4564b;--shadow:0 20px 60px rgba(8,25,37,.2)}
    *{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;font-family:Inter,"SF Pro Display","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(45,164,156,.22);outline-offset:1px}
    .app{height:100vh;display:flex;overflow:hidden}.side{width:214px;flex:none;padding:18px 12px;color:#b8c7cf;background:linear-gradient(180deg,var(--nav),var(--nav2))}.brand{height:44px;padding:0 9px;display:flex;align-items:center;gap:9px;color:#fff;font-weight:700}.brand-mark{width:29px;height:29px;display:grid;place-items:center;border-radius:8px;color:#fff;background:#10948b}.side-item{height:38px;margin-top:7px;padding:0 10px;display:flex;align-items:center;gap:9px;border-radius:6px;color:#aebdc6;font-size:12px}.side-item.active{color:#fff;background:rgba(19,160,147,.2)}.main{min-width:0;flex:1;overflow:hidden;padding:28px}.page-title h1{margin:0;font-size:24px}.page-title p{margin:7px 0 0;color:var(--muted);font-size:13px}.fake-card{height:170px;margin-top:22px;border:1px solid var(--line);border-radius:10px;background:#fff}.fake-line{height:48px;padding:0 18px;display:flex;align-items:center;border-bottom:1px solid var(--line2);color:var(--muted);font-size:13px}
    .backdrop{position:fixed;inset:0;padding:22px;display:grid;place-items:center;overflow:hidden;background:rgba(8,25,37,.48);backdrop-filter:blur(3px)}.modal{width:min(980px,calc(100vw - 44px));height:calc(100vh - 44px);max-height:none;display:flex;flex-direction:column;overflow:hidden;border-radius:14px;background:#fff;box-shadow:var(--shadow)}.modal-head{flex:none;padding:18px 30px 15px;border-bottom:1px solid var(--line2)}.modal-head-top{display:flex;align-items:center;justify-content:space-between;gap:20px}.modal-icon{display:none}.close{width:32px;height:32px;border:0;color:#8b979e;background:transparent;font-size:26px;line-height:1}.modal h2{margin:0;font-size:24px;letter-spacing:-.3px}.modal-sub{display:none}.modal-body{min-height:0;flex:1;display:flex;flex-direction:column;overflow:hidden;padding:16px 30px 10px}.field-label{display:block;margin-bottom:8px;color:var(--ink);font-size:13px;font-weight:700}.source-wrap{position:relative;width:360px;max-width:100%}.source-trigger{width:100%;height:40px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;border:1px solid #d7e0e4;border-radius:7px;color:var(--text);background:#fff;font-size:13px;text-align:left}.source-trigger:hover,.source-wrap.open .source-trigger{border-color:#2da49c;box-shadow:0 0 0 3px rgba(45,164,156,.1)}.source-arrow{color:var(--muted);font-size:17px;line-height:1}.source-menu{position:absolute;top:calc(100% + 5px);right:0;left:0;z-index:10;display:none;padding:4px;border:1px solid #d7e0e4;border-radius:8px;background:#fff;box-shadow:0 12px 30px rgba(18,42,61,.16)}.source-wrap.open .source-menu{display:block}.source-option{width:100%;height:38px;padding:0 9px;display:flex;align-items:center;gap:8px;border:0;border-radius:5px;color:var(--text);background:#fff;font-size:13px;text-align:left}.source-option:hover,.source-option.active{color:var(--teal-dark);background:var(--teal-soft)}.source-option .source-check{width:16px;color:var(--teal);font-weight:700}.table-toolbar{margin-top:15px;display:flex;align-items:end;gap:16px}.table-toolbar .field-label{margin:0}.table-meta{display:none}.search-row{margin-top:8px;display:flex;align-items:center;gap:12px}.search{height:40px;min-width:0;flex:1;display:flex;align-items:center;gap:9px;padding:0 12px;border:1px solid #d7e0e4;border-radius:8px;background:#fff;color:#87949d}.search:focus-within{border-color:#2da49c;box-shadow:0 0 0 3px rgba(45,164,156,.1)}.search-icon{font-size:22px;line-height:1;transform:rotate(-20deg)}.search input{width:100%;height:100%;min-width:0;padding:0;border:0;outline:0;color:var(--text);background:transparent;font-size:13px}.search input::placeholder{color:#9aa6ae}.result-count{min-width:74px;color:var(--muted);font-size:12px;text-align:right;white-space:nowrap}.table-panel{min-height:0;flex:1;display:flex;flex-direction:column;margin-top:8px;overflow:hidden;border:1px solid var(--line);border-radius:9px}.table-fixed-head{flex:none}.select-all{min-height:43px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);color:var(--ink);background:#f3f6f7;font-size:13px;font-weight:700}.select-all label{display:flex;align-items:center;gap:9px;cursor:pointer}.select-all .selected-count{color:var(--muted);font-size:12px;font-weight:400}.table-scroll{min-height:0;flex:1;overflow:auto}.table-head,.table-row{display:grid;grid-template-columns:29px minmax(220px,1.05fr) minmax(0,1.65fr) 66px;gap:12px;align-items:center}.table-head{min-height:32px;padding:0 14px;color:#89949e;background:#fbfcfc;border-bottom:1px solid var(--line2);font-size:11px;font-weight:700}.table-row{min-height:42px;padding:0 14px;border-bottom:1px solid var(--line2);font-size:13px}.table-row:last-child{border-bottom:0}.table-row:hover{background:#f5fbfa}.table-row.checked{background:#f0faf7}.table-row input,.select-all input{width:17px;height:17px;margin:0;accent-color:var(--green)}.table-name{overflow:hidden;color:var(--ink);font-family:"SFMono-Regular",Consolas,monospace;font-weight:700;text-overflow:ellipsis;white-space:nowrap}.table-comment{overflow:hidden;color:#687984;text-overflow:ellipsis;white-space:nowrap}.table-rows{color:#89949e;font-size:12px;text-align:right;white-space:nowrap}.empty{padding:34px 12px;color:var(--muted);font-size:13px;text-align:center}.status{min-height:18px;margin-top:6px;color:var(--muted);font-size:12px}.status.error{color:var(--red)}.modal-foot{flex:none;padding:12px 30px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-top:1px solid var(--line2)}.foot-note{color:var(--muted);font-size:12px}.actions{display:flex;gap:8px}.button{height:38px;padding:0 16px;border:1px solid #d8e0e4;border-radius:7px;color:var(--text);background:#fff;font-size:13px;font-weight:700}.button.primary{color:#fff;border-color:var(--teal);background:var(--teal)}.button.primary:hover{background:var(--teal-dark)}.toast{position:fixed;right:24px;bottom:24px;padding:12px 16px;border-radius:8px;color:#fff;background:#17384d;box-shadow:0 8px 25px rgba(9,29,43,.25);font-size:13px;opacity:0;transform:translateY(8px);transition:.18s}.toast.show{opacity:1;transform:translateY(0)}
    @media(max-width:760px){.side{display:none}.main{padding:18px}.backdrop{padding:10px}.modal{width:calc(100vw - 20px);height:calc(100vh - 20px);max-height:none}.modal-head,.modal-body{padding-left:18px;padding-right:18px}.modal-foot{padding:13px 18px;align-items:flex-end;flex-direction:column}.table-head,.table-row{grid-template-columns:24px minmax(145px,1fr) minmax(120px,1fr) 50px;gap:7px}.table-row{min-height:48px}.table-comment{white-space:normal;line-height:1.35}.foot-note{width:100%}}
    /* Single-line fixed selection/header row. */
    .select-all{min-height:43px;display:grid;grid-template-columns:29px minmax(220px,1.05fr) minmax(0,1.65fr) 66px;gap:12px;align-items:center}
    .select-all label{justify-content:center}
    .select-all .column-label{color:var(--ink);font-size:12px;font-weight:700;white-space:nowrap}
    .select-all .rows-label{text-align:right}
    .select-all input{transition:transform .15s ease}
    .select-all label:hover input{transform:scale(1.08)}
    .table-head,.table-row{grid-template-columns:29px minmax(220px,1.05fr) minmax(0,1.65fr) 66px}
    @media(max-width:760px){.select-all,.table-head,.table-row{grid-template-columns:24px minmax(145px,1fr) minmax(120px,1fr) 50px}.select-all .column-label{font-size:11px}}
  </style>
  <link rel="stylesheet" href="../styles/typography.css">
</head>
<body>
  <div class="app">
    <aside class="side"><div class="brand"><span class="brand-mark">C</span><span>CubeBuddy</span></div><div class="side-item active">◇　语义模型</div><div class="side-item">⌁　数据源</div><div class="side-item">◎　业务术语</div><div class="side-item">◌　系统监控</div></aside>
    <main class="main"><div class="page-title"><h1>语义模型</h1><p>从物理数据表构建一致、可复用的业务语义。</p></div><div class="fake-card"><div class="fake-line">模型列表　　　　　　　　　　状态　　　　　　　　　　更新时间</div><div class="fake-line">订单分析　　　　　　　　　　已加载　　　　　　　　　　刚刚</div><div class="fake-line">用户分析　　　　　　　　　　草稿　　　　　　　　　　　昨天</div></div></main>
  </div>

  <div class="backdrop">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal-head"><div class="modal-head-top"><h2 id="modal-title">从真实数据库生成模型</h2><button class="close" type="button" aria-label="关闭">×</button></div></header>
      <div class="modal-body">
        <label class="field-label" for="source">数据源</label>
        <div class="source-wrap" id="source-picker"><button class="source-trigger" id="source-trigger" type="button" aria-haspopup="listbox" aria-expanded="false"><span id="source-value">analytics_db</span><span class="source-arrow">⌄</span></button><div class="source-menu" id="source-menu" role="listbox"><button class="source-option active" type="button" data-source="analytics_db"><span class="source-check">✓</span><span>analytics_db</span></button><button class="source-option" type="button" data-source="mysql_ods"><span class="source-check"></span><span>mysql_ods</span></button><button class="source-option" type="button" data-source="default"><span class="source-check"></span><span>default</span></button></div></div>
        <div class="table-toolbar"><label class="field-label">物理表</label></div>
        <div class="search-row"><label class="search"><span class="search-icon" aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索表名或中文注释" autocomplete="off"></label></div>
        <div class="table-panel" id="table-panel"><div class="table-fixed-head"><div class="select-all"><label><input id="select-all" type="checkbox" aria-label="全选当前结果"></label><span class="column-label">原始表名</span><span class="column-label">表中文注释</span><span class="column-label rows-label">行数</span></div></div><div class="table-scroll"><div id="table-list"></div><div id="empty" class="empty" hidden>没有匹配的物理表</div></div></div>
        <div id="status" class="status" aria-live="polite"></div>
      </div>
      <footer class="modal-foot"><span id="foot-note" class="foot-note">请选择至少 1 张物理表</span><div class="actions"><button class="button" type="button" id="cancel">取消</button><button class="button primary" type="button" id="generate">生成模型</button></div></footer>
    </section>
  </div>
  <div id="toast" class="toast" role="status"></div>

  <script>
    const tables = [
      ["catalog_items", "示例数据目录", "811"],
      ["term_synonym", "查询前术语扩展词典", "94"],
      ["inventory_summary_table", "库存汇总表", "1,208"],
      ["production_daily", "生产日报", "365"],
      ["production_failure_reasons", "生产失败原因", "28"],
      ["production_quality_test_results", "生产质量测试结果", "6,421"],
      ["production_summary_table", "生产汇总表", "2,104"],
      ["purchase_details_data", "采购明细数据", "15,092"],
      ["purchasing_monthly_data", "采购月度数据", "1,032"],
      ["sales_area_location", "销售区域位置", "86"],
      ["sales_summary_table", "销售汇总表", "3,560"],
      ["supplier_evaluation", "供应商评价", "4,218"],
      ["user_t", "用户基础信息", "28,704"]
    ];
    const selected = new Set();
    const sourcePicker = document.getElementById("source-picker");
    const sourceTrigger = document.getElementById("source-trigger");
    const sourceMenu = document.getElementById("source-menu");
    const sourceValue = document.getElementById("source-value");
    const search = document.getElementById("search");
    const selectAll = document.getElementById("select-all");
    const tableList = document.getElementById("table-list");
    const empty = document.getElementById("empty");
    const footNote = document.getElementById("foot-note");
    const status = document.getElementById("status");

    sourceTrigger.addEventListener("click", () => {
      const open = sourcePicker.classList.toggle("open");
      sourceTrigger.setAttribute("aria-expanded", String(open));
    });
    sourceMenu.addEventListener("click", (event) => {
      const option = event.target.closest("[data-source]");
      if (!option) return;
      sourceValue.textContent = option.dataset.source;
      sourceMenu.querySelectorAll(".source-option").forEach((item) => {
        const active = item === option;
        item.classList.toggle("active", active);
        item.querySelector(".source-check").textContent = active ? "✓" : "";
      });
      sourcePicker.classList.remove("open");
      sourceTrigger.setAttribute("aria-expanded", "false");
    });
    document.addEventListener("click", (event) => {
      if (sourcePicker.contains(event.target)) return;
      sourcePicker.classList.remove("open");
      sourceTrigger.setAttribute("aria-expanded", "false");
    });

    function filteredTables() {
      const query = search.value.trim().toLowerCase();
      return tables.filter(([name, comment]) => !query || `${name} ${comment}`.toLowerCase().includes(query));
    }

    function updateSummary(visible) {
      const selectedVisible = visible.filter(([name]) => selected.has(name)).length;
      footNote.textContent = selected.size ? `已选择 ${selected.size} 张物理表，将生成 ${selected.size} 个模型` : "请选择至少 1 张物理表";
      selectAll.checked = visible.length > 0 && selectedVisible === visible.length;
      selectAll.indeterminate = selectedVisible > 0 && selectedVisible < visible.length;
    }

    function render() {
      const visible = filteredTables();
      tableList.innerHTML = visible.map(([name, comment, rows]) => `<label class="table-row ${selected.has(name) ? "checked" : ""}"><input type="checkbox" data-table="${name}" ${selected.has(name) ? "checked" : ""}><span class="table-name">${name}</span><span class="table-comment">${comment}</span><span class="table-rows">${rows}</span></label>`).join("");
      empty.hidden = visible.length > 0;
      updateSummary(visible);
    }

    search.addEventListener("input", render);
    search.addEventListener("search", render);
    search.addEventListener("keyup", render);
    selectAll.addEventListener("change", () => {
      filteredTables().forEach(([name]) => selectAll.checked ? selected.add(name) : selected.delete(name));
      render();
    });
    tableList.addEventListener("change", (event) => {
      const input = event.target.closest("input[data-table]");
      if (!input) return;
      if (input.checked) selected.add(input.dataset.table); else selected.delete(input.dataset.table);
      render();
    });
    document.getElementById("generate").addEventListener("click", () => {
      if (!selected.size) { status.textContent = "请先选择至少 1 张物理表"; status.className = "status error"; return; }
      status.className = "status";
      status.textContent = `原型演示：已准备生成 ${selected.size} 个模型（不会写入真实数据库）`;
      document.getElementById("toast").textContent = `已选择 ${selected.size} 张表`;
      document.getElementById("toast").classList.add("show");
      setTimeout(() => document.getElementById("toast").classList.remove("show"), 1800);
    });
    document.getElementById("cancel").addEventListener("click", () => { status.textContent = "原型演示：取消按钮已触发"; status.className = "status"; });
    document.querySelector(".close").addEventListener("click", () => { document.querySelector(".backdrop").style.display = "none"; });
    render();
  </script>
</body>
</html>
