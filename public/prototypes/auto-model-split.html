<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>自动建模 · 左右分栏原型</title>
  <style>
    :root {
      --nav: #122a3d;
      --nav-dark: #0e2232;
      --teal: #0c8f87;
      --teal-dark: #087b74;
      --teal-soft: #e7f5f3;
      --ink: #17232f;
      --text: #34414d;
      --muted: #788691;
      --line: #dfe6e9;
      --line-soft: #edf1f2;
      --canvas: #f4f6f8;
      --white: #fff;
      --orange: #b86d34;
      --orange-soft: #fff7ef;
      --green: #1b936e;
      --shadow: 0 24px 70px rgba(8, 25, 37, .24);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      overflow: hidden;
      color: var(--ink);
      background: var(--canvas);
      font-family: Inter, "SF Pro Display", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible {
      outline: 3px solid rgba(45, 164, 156, .2);
      outline-offset: 1px;
    }

    .page-shell { display: flex; height: 100%; }
    .page-nav {
      width: 218px;
      flex: 0 0 auto;
      padding: 18px 12px;
      color: #b8c7cf;
      background: linear-gradient(180deg, var(--nav), var(--nav-dark));
    }
    .brand { display: flex; align-items: center; gap: 9px; height: 42px; padding: 0 9px; color: #fff; font-weight: 700; }
    .brand-mark { display: grid; width: 29px; height: 29px; place-items: center; border-radius: 8px; color: #fff; background: #10948b; }
    .nav-item { display: flex; align-items: center; gap: 9px; height: 38px; margin-top: 8px; padding: 0 10px; border-radius: 6px; color: #aebdc6; font-size: 12px; }
    .nav-item.active { color: #fff; background: rgba(19, 160, 147, .2); }
    .page-main { min-width: 0; flex: 1; padding: 28px; }
    .page-main h1 { margin: 0; font-size: 24px; }
    .page-main > p { margin: 7px 0 20px; color: var(--muted); font-size: 13px; }
    .fake-workbench { display: grid; grid-template-columns: 230px 1fr; height: 290px; border: 1px solid var(--line); border-radius: 10px; background: #fff; overflow: hidden; }
    .fake-list { padding: 18px; border-right: 1px solid var(--line-soft); }
    .fake-list strong { font-size: 14px; }
    .fake-list .fake-row { height: 43px; margin-top: 16px; padding: 12px; border-radius: 7px; background: #f3f7f7; font-size: 12px; }
    .fake-detail { padding: 24px; }
    .fake-detail .fake-line { height: 15px; width: 70%; margin-bottom: 16px; border-radius: 4px; background: #eef2f3; }
    .fake-detail .fake-line.short { width: 34%; }

    .scrim { position: fixed; inset: 0; display: grid; place-items: center; padding: 22px; background: rgba(8, 25, 37, .5); backdrop-filter: blur(3px); }
    .modal {
      display: flex;
      width: min(1120px, calc(100vw - 44px));
      height: min(780px, calc(100vh - 44px));
      min-height: 560px;
      flex-direction: column;
      overflow: hidden;
      border-radius: 14px;
      background: var(--white);
      box-shadow: var(--shadow);
    }
    .modal-head { display: flex; align-items: center; justify-content: space-between; flex: 0 0 auto; min-height: 72px; padding: 0 28px; border-bottom: 1px solid var(--line-soft); }
    .modal-title { display: flex; align-items: center; gap: 12px; }
    .modal-title-icon { display: grid; width: 32px; height: 32px; place-items: center; border-radius: 8px; color: var(--teal-dark); background: var(--teal-soft); font-weight: 800; }
    .modal-title h2 { margin: 0; font-size: 20px; letter-spacing: -.2px; }
    .close { width: 32px; height: 32px; border: 0; border-radius: 6px; color: #89959e; background: transparent; font-size: 24px; line-height: 1; }
    .close:hover { background: #f2f5f6; }

    .modal-body { display: grid; min-height: 0; flex: 1; grid-template-columns: 270px minmax(0, 1fr); }
    .source-pane { min-width: 0; padding: 22px 14px 16px; border-right: 1px solid var(--line); background: #fbfcfc; }
    .pane-heading { display: flex; align-items: center; justify-content: space-between; padding: 0 10px; }
    .pane-heading h3 { margin: 0; font-size: 17px; }
    .pane-heading span { color: var(--muted); font-size: 12px; }
    .source-search { display: flex; align-items: center; gap: 7px; height: 36px; margin: 15px 0 10px; padding: 0 10px; border: 1px solid var(--line); border-radius: 7px; background: #fff; color: #9aa5ad; }
    .source-search input { width: 100%; min-width: 0; height: 100%; border: 0; outline: 0; color: var(--text); background: transparent; font-size: 12px; }
    .source-search:focus-within { border-color: #2da49c; box-shadow: 0 0 0 3px rgba(45, 164, 156, .09); }
    .source-list { display: flex; flex-direction: column; gap: 4px; }
    .source-card { position: relative; display: flex; width: 100%; min-height: 68px; align-items: center; gap: 10px; padding: 0 10px; border: 1px solid transparent; border-radius: 8px; color: var(--text); background: transparent; text-align: left; }
    .source-card:hover { background: #f1f5f4; }
    .source-card.active { border-color: #d8e7e5; background: #fff; box-shadow: 0 1px 3px rgba(19, 42, 61, .06); }
    .source-card.active::before { position: absolute; top: 12px; bottom: 12px; left: -15px; width: 3px; border-radius: 0 3px 3px 0; background: var(--teal); content: ""; }
    .source-icon { display: grid; width: 30px; height: 30px; flex: 0 0 auto; place-items: center; border-radius: 7px; color: var(--teal-dark); background: var(--teal-soft); font-size: 12px; font-weight: 800; }
    .source-card-copy { min-width: 0; flex: 1; }
    .source-card strong, .source-card small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .source-card strong { color: var(--ink); font-size: 13px; }
    .source-card small { margin-top: 5px; color: var(--muted); font-size: 11px; }
    .source-empty { padding: 22px 10px; color: var(--muted); font-size: 12px; text-align: center; }

    .table-pane { min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
    .table-head { display: flex; flex: 0 0 auto; align-items: flex-start; justify-content: space-between; gap: 18px; padding: 22px 26px 16px; }
    .table-head h3 { margin: 0; font-size: 17px; }
    .table-head p { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
    .table-toolbar { display: flex; flex: 0 0 auto; align-items: center; gap: 10px; padding: 0 26px 14px; }
    .table-search { display: flex; min-width: 0; flex: 1; align-items: center; gap: 8px; height: 38px; padding: 0 10px; border: 1px solid var(--line); border-radius: 7px; color: #9aa5ad; background: #fff; }
    .table-search span { font-size: 17px; transform: rotate(-20deg); }
    .table-search input { width: 100%; min-width: 0; height: 100%; border: 0; outline: 0; color: var(--text); background: transparent; font-size: 12px; }
    .table-search:focus-within { border-color: #2da49c; box-shadow: 0 0 0 3px rgba(45, 164, 156, .09); }
    .table-box { min-height: 0; flex: 1; margin: 0 26px; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; }
    .table-scroll { height: 100%; overflow: auto; }
    .table-row { display: grid; grid-template-columns: 34px minmax(190px, 1.2fr) minmax(160px, 1fr) 76px; gap: 10px; align-items: center; min-height: 55px; padding: 0 14px; border-bottom: 1px solid var(--line-soft); color: var(--text); font-size: 12px; }
    .table-row:last-child { border-bottom: 0; }
    .table-row.header { min-height: 39px; color: #788691; background: #f7f9fa; font-size: 11px; font-weight: 700; }
    .table-row.item { cursor: pointer; }
    .table-row.item:hover { background: #f4fbfa; }
    .table-row.item.checked { background: #f0faf7; }
    .table-row input { width: 16px; height: 16px; margin: 0; accent-color: var(--teal); }
    .table-name { min-width: 0; overflow: hidden; color: var(--ink); font-family: "SFMono-Regular", Consolas, monospace; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .table-comment { min-width: 0; overflow: hidden; color: #647681; text-overflow: ellipsis; white-space: nowrap; }
    .table-rows { color: #88959e; text-align: right; white-space: nowrap; padding-right: 10px; }
    .table-empty { padding: 50px 20px; color: var(--muted); text-align: center; font-size: 12px; }
    .table-empty strong { display: block; margin-bottom: 7px; color: var(--text); font-size: 14px; }
    .table-foot { display: flex; flex: 0 0 auto; align-items: center; justify-content: space-between; gap: 14px; padding: 16px 26px 18px; }
    .inference-note { display: flex; min-width: 0; align-items: center; gap: 9px; color: var(--muted); font-size: 11px; }
    .inference-note i { display: grid; width: 23px; height: 23px; flex: 0 0 auto; place-items: center; border-radius: 50%; color: var(--orange); background: #fbead9; font-style: normal; font-weight: 800; }
    .inference-note span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .table-foot-actions { display: flex; align-items: center; gap: 9px; }
    .button { height: 36px; padding: 0 15px; border: 1px solid #d8e0e4; border-radius: 7px; color: var(--text); background: #fff; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .button:hover { background: #f8fafb; }
    .button.primary { border-color: var(--teal); color: #fff; background: var(--teal); }
    .button.primary:hover { background: var(--teal-dark); }
    .button.primary:disabled { cursor: not-allowed; opacity: .5; }
    .toast { position: fixed; right: 24px; bottom: 24px; padding: 11px 15px; border-radius: 8px; color: #fff; background: #17384d; box-shadow: 0 8px 25px rgba(9, 29, 43, .25); font-size: 12px; opacity: 0; pointer-events: none; transform: translateY(8px); transition: .18s; }
    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 780px) {
      .page-nav { display: none; }
      .page-main { padding: 18px; }
      .scrim { padding: 10px; }
      .modal { width: calc(100vw - 20px); height: calc(100vh - 20px); min-height: 0; }
      .modal-head { min-height: 64px; padding: 0 17px; }
      .modal-title h2 { font-size: 17px; }
      .modal-body { display: flex; flex-direction: column; overflow: auto; }
      .source-pane { flex: 0 0 auto; padding: 16px 16px 13px; border-right: 0; border-bottom: 1px solid var(--line); }
      .source-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
      .source-search { display: none; }
      .source-card { min-height: 54px; padding: 0 8px; }
      .source-card.active::before { top: auto; right: 10px; bottom: -14px; left: 10px; width: auto; height: 3px; }
      .source-card small { margin-top: 3px; }
      .source-icon { display: none; }
      .table-pane { min-height: 430px; }
      .table-head { padding: 18px 16px 13px; }
      .table-toolbar { padding: 0 16px 12px; }
      .table-box { margin: 0 16px; }
      .table-row { grid-template-columns: 28px minmax(145px, 1fr) minmax(120px, 1fr) 52px; gap: 7px; min-height: 52px; padding: 0 10px; }
      .table-foot { align-items: flex-end; flex-direction: column; padding: 13px 16px 16px; }
      .inference-note { width: 100%; }
      .table-foot-actions { width: 100%; justify-content: flex-end; }
    }
    @media (max-width: 500px) {
      .source-list { grid-template-columns: 1fr; }
      .source-card { min-height: 48px; }
      .source-card.active::before { top: 8px; right: auto; bottom: 8px; left: -17px; width: 3px; height: auto; }
      .table-head { display: block; }
      .table-comment { white-space: normal; line-height: 1.35; }
    }
  </style>
  <link rel="stylesheet" href="../styles/typography.css">
</head>
<body>
  <div class="page-shell" aria-hidden="true">
    <aside class="page-nav">
      <div class="brand"><span class="brand-mark">C</span><span>CubeBuddy</span></div>
      <div class="nav-item active">◇　语义模型</div>
      <div class="nav-item">⌁　数据源</div>
      <div class="nav-item">◎　业务术语</div>
      <div class="nav-item">◌　系统监控</div>
    </aside>
    <main class="page-main">
      <h1>语义模型</h1>
      <p>统一维护业务口径，并在发布前完成校验与测试。</p>
      <div class="fake-workbench">
        <div class="fake-list"><strong>模型　2</strong><div class="fake-row">订单分析</div><div class="fake-row">用户分析</div></div>
        <div class="fake-detail"><div class="fake-line"></div><div class="fake-line short"></div><div class="fake-line"></div></div>
      </div>
    </main>
  </div>

  <div class="scrim">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal-head">
        <div class="modal-title">
          <span class="modal-title-icon">◇</span>
          <div><h2 id="modal-title">自动建模</h2></div>
        </div>
        <button class="close" id="close" type="button" aria-label="关闭">×</button>
      </header>

      <div class="modal-body">
        <aside class="source-pane" aria-label="数据源列表">
          <div class="pane-heading"><h3>数据源</h3><span id="source-count">3</span></div>
          <label class="source-search"><span>⌕</span><input id="source-search" type="search" placeholder="搜索数据源" aria-label="搜索数据源"></label>
          <div class="source-list" id="source-list"></div>
        </aside>

        <section class="table-pane" aria-label="物理表选择">
          <div class="table-head">
            <div><h3>选择物理表</h3></div>
          </div>
          <div class="table-toolbar">
            <label class="table-search"><span>⌕</span><input id="table-search" type="search" placeholder="搜索表名或中文注释" aria-label="搜索表名或中文注释"></label>
          </div>
          <div class="table-box">
            <div class="table-scroll" id="table-scroll">
              <div class="table-row header"><label><input id="select-all" type="checkbox" aria-label="全选当前列表"></label><span>原始表名</span><span>表中文注释</span><span class="table-rows">行数</span></div>
              <div id="table-list"></div>
              <div class="table-empty" id="table-empty" hidden><strong>没有匹配的物理表</strong><span>试试其他关键词，或切换数据源。</span></div>
            </div>
          </div>
          <footer class="table-foot">
            <div class="inference-note"><i>i</i><span id="inference">已选择 2 张表</span></div>
            <div class="table-foot-actions"><button class="button" id="cancel" type="button">取消</button><button class="button primary" id="generate" type="button">生成模型</button></div>
          </footer>
        </section>
      </div>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const sources = [
      { id: "analytics_db", type: "MySQL", database: "analytics_db", icon: "M", tables: [
        ["orders", "订单事实表", "128,640", "fact"], ["order_items", "订单明细", "486,012", "fact"], ["users", "用户基础信息", "28,704", "dim"],
        ["products", "商品目录", "12,508", "dim"], ["refund_records", "退款记录", "3,218", "fact"], ["term_synonym", "查询前术语扩展词典", "94", "dim"]
      ]},
      { id: "mysql_ods", type: "MySQL", database: "ecommerce", icon: "M", tables: [
        ["ods_sales_daily", "销售日报", "9,842", "fact"], ["ods_customer", "客户主数据", "18,992", "dim"], ["ods_inventory", "库存快照", "72,660", "fact"], ["ods_region", "区域维表", "86", "dim"]
      ]},
      { id: "default", type: "PostgreSQL", database: "default", icon: "P", tables: [
        ["production_summary", "生产汇总表", "2,104", "fact"], ["supplier_evaluation", "供应商评价", "4,218", "fact"], ["factory", "工厂信息", "46", "dim"]
      ]}
    ];

    let activeSource = sources[0];
    const selected = new Set(["orders", "order_items"]);
    const sourceList = document.getElementById("source-list");
    const sourceSearch = document.getElementById("source-search");
    const tableSearch = document.getElementById("table-search");
    const tableList = document.getElementById("table-list");
    const tableEmpty = document.getElementById("table-empty");
    const selectAll = document.getElementById("select-all");
    const inference = document.getElementById("inference");
    const generate = document.getElementById("generate");

    function visibleSources() {
      const query = sourceSearch.value.trim().toLowerCase();
      return sources.filter((item) => `${item.id} ${item.database} ${item.type}`.toLowerCase().includes(query));
    }

    function visibleTables() {
      const query = tableSearch.value.trim().toLowerCase();
      return activeSource.tables.filter(([name, comment]) => {
        const matchesQuery = !query || `${name} ${comment}`.toLowerCase().includes(query);
        return matchesQuery;
      });
    }

    function renderSources() {
      const items = visibleSources();
      sourceList.innerHTML = items.length ? items.map((item) => `
        <button class="source-card ${item.id === activeSource.id ? "active" : ""}" type="button" data-source="${item.id}">
          <span class="source-icon">${item.icon}</span><span class="source-card-copy"><strong>${item.id}</strong><small>${item.type} · ${item.database}</small></span>
        </button>`).join("") : "";
      sourceList.querySelectorAll("[data-source]").forEach((button) => button.addEventListener("click", () => {
        activeSource = sources.find((item) => item.id === button.dataset.source);
        selected.clear();
        tableSearch.value = "";
        renderSources();
        renderTables();
      }));
    }

    function updateSummary(visible) {
      const selectedVisible = visible.filter(([name]) => selected.has(name)).length;
      selectAll.checked = visible.length > 0 && selectedVisible === visible.length;
      selectAll.indeterminate = selectedVisible > 0 && selectedVisible < visible.length;
      inference.textContent = selected.size ? `已选择 ${selected.size} 张表` : "请选择至少 1 张物理表，系统将自动推断字段";
      generate.disabled = selected.size === 0;
    }

    function renderTables() {
      const items = visibleTables();
      tableList.innerHTML = items.map(([name, comment, rows]) => `
        <label class="table-row item ${selected.has(name) ? "checked" : ""}"><input type="checkbox" data-table="${name}" ${selected.has(name) ? "checked" : ""}><span class="table-name">${name}</span><span class="table-comment">${comment}</span><span class="table-rows">${rows}</span></label>`).join("");
      tableEmpty.hidden = items.length > 0;
      updateSummary(items);
      tableList.querySelectorAll("input[data-table]").forEach((input) => input.addEventListener("change", () => {
        if (input.checked) selected.add(input.dataset.table); else selected.delete(input.dataset.table);
        renderTables();
      }));
    }

    sourceSearch.addEventListener("input", renderSources);
    tableSearch.addEventListener("input", renderTables);
    selectAll.addEventListener("change", () => {
      visibleTables().forEach(([name]) => selectAll.checked ? selected.add(name) : selected.delete(name));
      renderTables();
    });

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 2200);
    }

    document.getElementById("generate").addEventListener("click", () => {
      if (!selected.size) return;
      showToast(`原型演示：已准备生成 ${selected.size} 个模型草稿`);
    });
    document.getElementById("cancel").addEventListener("click", () => showToast("原型演示：取消按钮已触发"));
    document.getElementById("close").addEventListener("click", () => showToast("原型演示：关闭按钮已触发"));

    renderSources();
    renderTables();
  </script>
</body>
</html>
