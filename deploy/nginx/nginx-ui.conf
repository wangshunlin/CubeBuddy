# Nginx-UI management panel. Keep this route behind authentication and do not
# expose the Docker-socket-backed service directly to the public internet.
map $http_upgrade $nginx_ui_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name nginx-ui.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name nginx-ui.example.com;

    ssl_certificate     /etc/nginx/ssl/example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /var/log/nginx/nginx-ui.access.log;
    error_log /var/log/nginx/nginx-ui.error.log;

    location / {
        proxy_pass http://127.0.0.1:19000;
        include /etc/nginx/proxy.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $nginx_ui_connection_upgrade;
    }
}
