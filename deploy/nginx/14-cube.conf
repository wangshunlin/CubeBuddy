# 14-cube -> unified Compose Gateway http://127.0.0.1:18180
# 由宿主机 Nginx 加载：/etc/nginx/conf.d/14-cube.conf
# upstream backend_cube 定义在 zz-upstreams.conf
server {
    listen 80;
    server_name cube.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cube.example.com;

    ssl_certificate     /etc/nginx/ssl/example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 路由、OpenAPI 和工具鉴权全部由 Compose 内 Gateway 统一处理。
    location / {
        proxy_pass http://127.0.0.1:18180;
        include /etc/nginx/proxy.conf;
    }
}
