events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  client_max_body_size 20m;

  upstream cube_api { server cube_api:4000; }
  upstream cube_console { server cube_console:4010; }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Cube / OpenAPI 入口
  server {
    listen 80;

    location = /gateway-healthz {
      default_type text/plain;
      return 200 'ok';
    }

    location = /openapi.yaml { proxy_pass http://cube_console; include /etc/nginx/proxy_params; }
    location = /openapi.json { proxy_pass http://cube_console; include /etc/nginx/proxy_params; }

    location ^~ /mcp {
      proxy_pass http://cube_console;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
      add_header X-Accel-Buffering no always;
    }

    location = /cubejs-api/v1/meta { proxy_pass http://cube_console; include /etc/nginx/proxy_params; }
    location ^~ /cubejs-api/v1/meta/ { proxy_pass http://cube_console; include /etc/nginx/proxy_params; }
    location = /cubejs-api/v1/load { proxy_pass http://cube_console; include /etc/nginx/proxy_params; }
    location = /cubejs-api/v1/search { proxy_pass http://cube_console; include /etc/nginx/proxy_params; }
    location = /cubejs-api/v1/glossary-resolve { proxy_pass http://cube_console; include /etc/nginx/proxy_params; }
    location = /cubejs-api/v1/sql { proxy_pass http://cube_console; include /etc/nginx/proxy_params; }
    location = /cubejs-api/v1/dry-run { proxy_pass http://cube_console; include /etc/nginx/proxy_params; }
    location = /readyz { proxy_pass http://cube_api; include /etc/nginx/proxy_params; }
    location = /livez { proxy_pass http://cube_api; include /etc/nginx/proxy_params; }

    location / { proxy_pass http://cube_api; include /etc/nginx/proxy_params; }
  }

  # 配置台入口（无域名时使用独立端口 18081）
  server {
    listen 81;
    location / {
      proxy_pass http://cube_console;
      include /etc/nginx/proxy_params;
    }
  }
}
